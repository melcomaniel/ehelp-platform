# fly.toml app configuration file generated for Nest backend
#
# See https://fly.io/docs/reference/configuration/
#
# Launch from GitHub: Working directory = backend, Config path = fly.toml

app = 'egov-app-ground'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
